name: Lentor trusted live smoke
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful Lentor CI dev push run for this exact dispatched revision
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  live:
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 15
    environment: lentor-live-smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - protocol: responses
            model: inclusionai/ling-3.1-flash-1019
            base: https://ai-gateway.vercel.sh/v1
          - protocol: chat
            model: inclusionai/ling-3.1-flash-1019
            base: https://ai-gateway.vercel.sh/v1
          - protocol: messages
            model: inclusionai/ling-3.1-flash-1019
            base: https://ai-gateway.vercel.sh/v1/messages
    steps:
      - name: Require successful same-revision trusted push artifact
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        with:
          script: |
            if (!/^[0-9]+$/.test(process.env.CI_RUN_ID)) throw new Error('Invalid CI run ID');
            const {data: run} = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner, repo: context.repo.repo, run_id: Number(process.env.CI_RUN_ID)
            });
            if (run.event !== 'push' || run.head_branch !== 'dev' || run.conclusion !== 'success' ||
                run.head_sha !== context.sha || run.head_repository?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                run.path.split('@')[0] !== '.github/workflows/lentor-ci.yml') {
              throw new Error('CI artifact must come from successful same-revision dev push Lentor CI');
            }
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lentor-windows-ci
          path: candidate
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify candidate offline and extract
        shell: pwsh
        run: |
          Remove-Item Env:VercelAPI -ErrorAction SilentlyContinue
          python scripts/lentor_smoke.py candidate/lentor-ci.zip
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath candidate/lentor-ci.zip -DestinationPath candidate/package
      - name: Run explicit provider integration smoke
        shell: pwsh
        env:
          VercelAPI: ${{ secrets.VERCEL_API_KEY }}
          SMOKE_PROTOCOL: ${{ matrix.protocol }}
          SMOKE_MODEL: ${{ matrix.model }}
          SMOKE_BASE: ${{ matrix.base }}
        run: |
          python scripts/lentor_live_smoke.py --binary candidate/package/bin/lentor.exe --protocol $env:SMOKE_PROTOCOL --model $env:SMOKE_MODEL --base $env:SMOKE_BASE
          exit $LASTEXITCODE
